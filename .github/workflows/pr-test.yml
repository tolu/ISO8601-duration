name: Run Tests
on:
  push:
    branches: [master]
  # also runs for PRs from forks, which a push trigger does not
  pull_request:
jobs:
  Npm-Install-And-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          # tests validate against the native Temporal, which needs Node.js 26+
          node-version: 'lts/*'
      - run: npm install
      - run: npm test
